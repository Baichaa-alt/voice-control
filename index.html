<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งงานด้วยเสียง</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 1.8rem; }
        .mic-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .mic-btn {
            width: 120px; height: 120px; border-radius: 50%; border: none;
            background: linear-gradient(145deg, #e94560, #c23b51);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background: linear-gradient(145deg, #00d9ff, #00a8cc);
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .mic-icon { width: 50px; height: 50px; fill: white; }
        .status { margin-top: 15px; font-size: 1.1rem; color: #a0a0a0; }
        .status.active { color: #00d9ff; }
        .transcript, .response {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            min-height: 60px; text-align: center; font-size: 1.1rem;
        }
        .response { background: rgba(0, 217, 255, 0.1); border: 1px solid rgba(0, 217, 255, 0.3); }
        .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 20px; text-align: center;
        }
        .card-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .card-title { font-size: 0.8rem; color: #a0a0a0; margin-bottom: 5px; }
        .card-value { font-size: 1.2rem; font-weight: bold; }
        .light-card.on { background: rgba(255, 220, 100, 0.2); box-shadow: 0 0 30px rgba(255, 220, 100, 0.3); }
        .commands { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 15px; }
        .commands h3 { margin-bottom: 10px; color: #a0a0a0; font-size: 0.9rem; }
        .command-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .command-tag {
            background: rgba(233, 69, 96, 0.2); border: 1px solid rgba(233, 69, 96, 0.4);
            padding: 6px 12px; border-radius: 15px; font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 สั่งงานด้วยเสียง</h1>
        <div class="mic-container">
            <button class="mic-btn" id="micBtn" onclick="toggleListening()">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <div class="status" id="status">กดปุ่มเพื่อเริ่มพูด</div>
        </div>
        <div class="transcript" id="transcript"><span style="color:#666">คำสั่งของคุณ...</span></div>
        <div class="response" id="response"><span style="color:#666">คำตอบ...</span></div>
        <div class="cards">
            <div class="card light-card" id="lightCard">
                <div class="card-icon">💡</div>
                <div class="card-title">สถานะไฟ</div>
                <div class="card-value" id="lightStatus">ปิด</div>
            </div>
            <div class="card">
                <div class="card-icon">🕐</div>
                <div class="card-title">เวลา</div>
                <div class="card-value" id="timeDisplay">--:--</div>
            </div>
            <div class="card">
                <div class="card-icon">📅</div>
                <div class="card-title">วันที่</div>
                <div class="card-value" id="dateDisplay">--</div>
            </div>
            <div class="card">
                <div class="card-icon">🌡️</div>
                <div class="card-title">อุณหภูมิ</div>
                <div class="card-value" id="tempDisplay">-- °C</div>
            </div>
        </div>
        <div class="commands">
            <h3>📋 คำสั่งที่รองรับ:</h3>
            <div class="command-list">
                <span class="command-tag">เปิดไฟ</span>
                <span class="command-tag">ปิดไฟ</span>
                <span class="command-tag">กี่โมง</span>
                <span class="command-tag">วันนี้วันอะไร</span>
                <span class="command-tag">อุณหภูมิ</span>
            </div>
        </div>
    </div>
    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition, isListening = false, lightOn = false;
        let temperature = Math.floor(Math.random() * 10) + 25;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening');
                document.getElementById('status').textContent = '🎤 กำลังฟัง...';
                document.getElementById('status').classList.add('active');
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').classList.remove('listening');
                document.getElementById('status').textContent = 'กดปุ่มเพื่อเริ่มพูด';
                document.getElementById('status').classList.remove('active');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('transcript').innerHTML = `"${transcript}"`;
                if (event.results[0].isFinal) processCommand(transcript);
            };
        }

        function toggleListening() {
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH';
            speechSynthesis.speak(utterance);
        }

        function processCommand(command) {
            const cmd = command.toLowerCase();
            let response = '';

            if (cmd.includes('เปิดไฟ')) {
                lightOn = true; updateLight();
                response = 'เปิดไฟให้แล้วครับ';
            } else if (cmd.includes('ปิดไฟ')) {
                lightOn = false; updateLight();
                response = 'ปิดไฟให้แล้วครับ';
            } else if (cmd.includes('กี่โมง') || cmd.includes('เวลา')) {
                const now = new Date();
                response = `ตอนนี้ ${now.getHours()} นาฬิกา ${now.getMinutes()} นาทีครับ`;
            } else if (cmd.includes('วัน')) {
                const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
                const now = new Date();
                response = `วันนี้วัน${days[now.getDay()]}ที่ ${now.getDate()} ครับ`;
            } else if (cmd.includes('อุณหภูมิ') || cmd.includes('อากาศ')) {
                temperature = Math.floor(Math.random() * 10) + 25;
                updateTemp();
                response = `อุณหภูมิ ${temperature} องศาครับ`;
            } else {
                response = 'ไม่เข้าใจคำสั่ง ลองใหม่ครับ';
            }

            document.getElementById('response').innerHTML = `🤖 ${response}`;
            speak(response);
        }

        function updateLight() {
            const card = document.getElementById('lightCard');
            const status = document.getElementById('lightStatus');
            if (lightOn) { card.classList.add('on'); status.textContent = 'เปิด'; }
            else { card.classList.remove('on'); status.textContent = 'ปิด'; }
        }

        function updateTemp() {
            document.getElementById('tempDisplay').textContent = `${temperature} °C`;
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('th-TH');
            const days = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
            document.getElementById('dateDisplay').textContent = `${days[now.getDay()]} ${now.getDate()}/${now.getMonth()+1}`;
        }

        setInterval(updateTime, 1000);
        updateTime();
        updateTemp();
    </script>
</body>
</html>
